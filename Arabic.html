<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مادة العربي | منصة البكالوريا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root { --bg: #f8fafc; --text: #0f172a; --card: #ffffff; --accent: #4f46e5; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; --muted: #64748b; }
    body.dark { --bg: #0b1120; --text: #f8fafc; --card: #1e293b; --accent: #1e1e2d; --border: #334155; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); transition: background 0.4s, color 0.4s; min-height: 100vh; }
    .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: 0.2s; }
    .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .card h3 { font-size: 18px; color: var(--text); }
    .card p { font-size: 13px; color: var(--muted); margin-top: 5px; }
    .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: bold; display: inline-block; text-decoration: none; }
    .page-title { font-size: 24px; margin-bottom: 20px; font-weight: 800; }
</style>
</head>
<body>
    <div class="container">
        <div id="page-exams">
            <a href="index.html" class="back-btn">🔙 رجوع للمنصة</a>
            <h2 class="page-title" style="color: var(--accent);">📖 امتحانات مادة العربي</h2>
            <div class="grid-container" id="examsGrid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDe5INvR_ifEARHmw7M0qqBQ34-G6z4p7w", authDomain: "mansa-educational.firebaseapp.com", projectId: "mansa-educational", storageBucket: "mansa-educational.firebasestorage.app", messagingSenderId: "144298769750", appId: "1:144298769750:web:43eb0c63e5d2acb37baaf7" };
        const app = initializeApp(firebaseConfig, "arabicExamsApp");
        const db = getFirestore(app);
        const examsRef = collection(db, "exams");

        if (localStorage.getItem('bakaloria_theme') === 'dark') { document.body.classList.add('dark'); }

        async function loadExams() {
            const grid = document.getElementById('examsGrid');
            grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">⏳ جاري التحميل...</p>';
            try {
                const q = query(examsRef, where("subject", "==", "arabic"));
                const snap = await getDocs(q);
                if (snap.empty) {
                    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--muted);">لا توجد امتحانات لهذه المادة بعد.</p>';
                } else {
                    grid.innerHTML = '';
                    snap.forEach(d => {
                        const exam = d.data();
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<h3>${exam.title}</h3><p>${exam.questions.length} أسئلة</p>`;
                        card.onclick = () => window.location.href = `test.html?subject=arabic&exam=${d.id}`;
                        grid.appendChild(card);
                    });
                }
            } catch(e) { grid.innerHTML = `<p style="color:red; grid-column:1/-1;">خطأ: ${e.message}</p>`; }
        }
        loadExams();
    </script>
</body>
</html>
