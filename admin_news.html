<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة أخبار اللعبة | منصة البكالوريا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050a14; --card: #0a1428; --text: #e2e8f0;
        --accent: #00f0ff; --success: #00ff88; --danger: #ff3b3b; --border: #1a365d;
        --warning: #f5a000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .container { max-width: 750px; margin: 0 auto; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 20px; font-size: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .card h2 { color: var(--accent); font-size: 18px; margin-bottom: 15px; }
    label { display: block; font-size: 14px; color: #aaa; margin-bottom: 5px; margin-top: 12px; }
    input, textarea, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 90px; resize: vertical; }
    button { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #000; width: 100%; }
    .btn-primary:hover { background: #00ccdd; }
    .btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; font-size: 13px; margin: 0; }
    .btn-danger:hover { background: #cc2f2f; }
    .news-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .news-row { background: rgba(0,240,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .news-row .info { flex: 1; }
    .news-row .info .text { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    .news-row .info .meta { font-size: 12px; color: #888; line-height: 1.8; }
    .news-row .info .meta b { color: var(--accent); }
    .empty { text-align: center; color: #666; padding: 20px; }
    .msg { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; font-weight: bold; text-align: center; }
    .msg.ok { background: rgba(0,255,136,0.15); color: var(--success); }
    .msg.err { background: rgba(255,59,59,0.15); color: var(--danger); }
    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
    .help { font-size: 12px; color: #888; margin-top: 5px; line-height: 1.7; }

    /* ✅ معاينة التحليل */
    .preview-box { background: rgba(0,240,255,0.06); border: 1px dashed var(--accent); border-radius: 12px; padding: 12px; margin-top: 12px; display: none; }
    .preview-box.show { display: block; }
    .preview-box .pv-title { font-size: 13px; font-weight: bold; color: var(--accent); margin-bottom: 8px; }
    .preview-row { font-size: 13px; color: #ccc; margin-bottom: 5px; }
    .preview-row b { color: var(--accent); }
    .preview-row .plus { color: var(--success); font-weight: bold; }
    .preview-row .minus { color: var(--danger); font-weight: bold; }
    .auto-badge { display: inline-block; background: rgba(0,255,136,0.15); color: var(--success); font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-right: 5px; }
</style>
</head>
<body>
<div class="container">
    <h1>📰 إدارة أخبار اللعبة</h1>

    <!-- ✅ إضافة خبر جديد -->
    <div class="card">
        <h2>➕ إضافة خبر جديد <span class="auto-badge">تحليل تلقائي</span></h2>

        <label>📝 نص الخبر (الصقه هنا):</label>
        <textarea id="newsText" placeholder="مثال: أعلنت شركة أبل عن أرباح قياسية تفوق التوقعات، مما رفع سهمها بشكل كبير في البورصة"></textarea>
        <div class="help">اكتب الخبر بأي صيغة. الكود هيفهم لوحده الشركة والتأثير من الكلمات المفتاحية.</div>

        <div class="preview-box" id="previewBox">
            <div class="pv-title">🔍 تحليل تلقائي للخبر:</div>
            <div class="preview-row">🏢 الشركات: <b id="pvCompanies">—</b></div>
            <div class="preview-row">📊 التأثير: <b id="pvEffect">—</b></div>
            <div class="preview-row" id="pvTypeRow" style="display:none;">🎯 نوع الخبر: <b id="pvType">—</b></div>
        </div>

        <label>⚙️ التحكم اليدوي (اختياري):</label>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <select id="manualCompany" style="flex:1; min-width:150px;">
                <option value="">— اختر شركة (اختياري) —</option>
            </select>
            <select id="manualEffect" style="flex:1; min-width:150px;">
                <option value="">— شدة التأثير (اختياري) —</option>
                <option value="0.10">قوي جداً (+10%)</option>
                <option value="0.07">قوي (+7%)</option>
                <option value="0.05">متوسط (+5%)</option>
                <option value="0.03">ضعيف (+3%)</option>
                <option value="-0.03">ضعيف سلبي (-3%)</option>
                <option value="-0.05">متوسط سلبي (-5%)</option>
                <option value="-0.07">قوي سلبي (-7%)</option>
                <option value="-0.10">قوي جداً سلبي (-10%)</option>
            </select>
        </div>
        <div class="help">لو سبتهم فاضيين، الكود هيستخدم التحليل التلقائي.</div>

        <button class="btn-primary" onclick="addNews()">💾 حفظ ونشر</button>
        <div id="msg"></div>
    </div>

    <!-- ✅ قائمة الأخبار الموجودة -->
    <div class="card">
        <h2>📋 الأخبار الموجودة (<span id="newsCount">0</span>)</h2>
        <div id="newsList" class="news-list">
            <div class="empty">⏳ جاري التحميل...</div>
        </div>
    </div>

    <a href="index.html" class="back-link">🔙 رجوع للمنصة</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDe5INvR_ifEARHmw7M0qqBQ34-G6z4p7w",
    authDomain: "mansa-educational.firebaseapp.com",
    projectId: "mansa-educational",
    storageBucket: "mansa-educational.firebasestorage.app",
    messagingSenderId: "144298769750",
    appId: "1:144298769750:web:43eb0c63e5d2acb37baaf7"
};

const app = initializeApp(firebaseConfig, "adminNewsApp");
const db = getFirestore(app);
const newsRef = collection(db, "game_news");

// ✅ التحقق من أن المستخدم مدير
const user = JSON.parse(localStorage.getItem('bakaloria_user') || '{}');
if (user.role !== 'admin') {
    document.body.innerHTML = '<div style="text-align:center; padding:50px; color:#ff3b3b; font-size:20px;">🚫 هذه الصفحة للمدير فقط</div>';
    throw new Error('Not admin');
}

// ✅ قاموس الشركات: اسم عربي + إنجليزي + ID
const COMPANIES = [
    // مصر
    { id: 'eg1', name: 'البنك الأهلي', en: ['nbe', 'national bank', 'ahli'], ar: ['البنك الأهلي', 'الأهلي'] },
    { id: 'eg2', name: 'طلعت مصطفى', en: ['talaat', 'moustafa', 'tmgh'], ar: ['طلعت مصطفى', 'طلعت'] },
    { id: 'eg3', name: 'السويدي', en: ['elsewedy', 'sewedy', 'electric'], ar: ['السويدي', 'سويدي'] },
    { id: 'eg4', name: 'حديد عز', en: ['ezz', 'steel', 'ezz steel'], ar: ['حديد عز', 'عز'] },
    { id: 'eg5', name: 'فوري', en: ['fawry', 'fawri'], ar: ['فوري'] },
    // اليابان
    { id: 'jp1', name: 'تويوتا', en: ['toyota'], ar: ['تويوتا'] },
    { id: 'jp2', name: 'سوني', en: ['sony'], ar: ['سوني'] },
    { id: 'jp3', name: 'نيسان', en: ['nissan'], ar: ['نيسان'] },
    { id: 'jp4', name: 'باناسونيك', en: ['panasonic'], ar: ['باناسونيك'] },
    { id: 'jp5', name: 'نينتندو', en: ['nintendo'], ar: ['نينتندو'] },
    // أمريكا
    { id: 'us1', name: 'أبل', en: ['apple', 'iphone'], ar: ['أبل', 'ابل', 'آيفون', 'ايفون'] },
    { id: 'us2', name: 'مايكروسوفت', en: ['microsoft', 'windows'], ar: ['مايكروسوفت', 'ويندوز'] },
    { id: 'us3', name: 'أمازون', en: ['amazon'], ar: ['أمازون', 'امازون'] },
    { id: 'us4', name: 'تسلا', en: ['tesla'], ar: ['تسلا'] },
    { id: 'us5', name: 'جوجل', en: ['google', 'alphabet'], ar: ['جوجل', 'قوقل'] }
];

// ✅ قاموس الكلمات الإيجابية والسلبية
const POSITIVE_WORDS = ['أرباح', 'ربح', 'نمو', 'ارتفاع', 'صعود', 'قوي', 'قياسي', 'توسع', 'نجاح', 'ابتكار', 'جديد', 'تفوق', 'توقعات إيجابية', 'زيادة', 'انتعاش', 'استحواذ', 'شراكة', 'عقد', 'صفقة', 'إطلاق', 'منتج جديد', 'مبيعات مرتفعة', 'profit', 'growth', 'surge', 'gain', 'record', 'success', 'innovative', 'launch', 'deal', 'partnership'];
const NEGATIVE_WORDS = ['خسارة', 'خسائر', 'انخفاض', 'هبوط', 'تراجع', 'ضعف', 'أزمة', 'غرامة', 'تحقيق', 'تسريح', 'إفلاس', 'ديون', 'توقعات سلبية', 'تسريح عمال', 'انخفاض المبيعات', 'مشكلة', 'عيب', 'استدعاء', 'loss', 'decline', 'drop', 'fall', 'crisis', 'fine', 'investigation', 'layoff', 'bankruptcy', 'recall', 'problem'];

// ✅ تحليل الخبر: استخراج الشركات والتأثير
function analyzeNews(text) {
    const lowerText = text.toLowerCase();

    // 1. استخراج الشركات
    const matchedCompanies = [];
    COMPANIES.forEach(c => {
        const allNames = [...c.ar, ...c.en];
        const found = allNames.some(name => lowerText.includes(name.toLowerCase()));
        if (found) matchedCompanies.push(c);
    });

    // 2. تحليل المشاعر (إيجابي/سلبي)
    let posScore = 0;
    let negScore = 0;
    POSITIVE_WORDS.forEach(w => { if (lowerText.includes(w.toLowerCase())) posScore++; });
    NEGATIVE_WORDS.forEach(w => { if (lowerText.includes(w.toLowerCase())) negScore++; });

    let sentiment = 'neutral';
    let baseEffect = 0;
    if (posScore > negScore) { sentiment = 'positive'; baseEffect = 0.05; }
    else if (negScore > posScore) { sentiment = 'negative'; baseEffect = -0.05; }

    // 3. شدة التأثير حسب قوة الكلمات
    const strongWords = ['قياسي', 'كبير', 'ضخم', 'قوي جداً', 'انهيار', 'أزمة كبرى', 'record', 'huge', 'massive', 'major', 'crash'];
    const hasStrong = strongWords.some(w => lowerText.includes(w.toLowerCase()));
    if (hasStrong && baseEffect !== 0) {
        baseEffect = baseEffect > 0 ? 0.10 : -0.10;
    }

    return {
        companies: matchedCompanies,
        companyIds: matchedCompanies.map(c => c.id),
        sentiment: sentiment,
        effect: baseEffect
    };
}

// ✅ معاينة فورية عند الكتابة
document.getElementById('newsText').addEventListener('input', function() {
    const text = this.value.trim();
    const previewBox = document.getElementById('previewBox');
    const pvCompanies = document.getElementById('pvCompanies');
    const pvEffect = document.getElementById('pvEffect');
    const pvTypeRow = document.getElementById('pvTypeRow');
    const pvType = document.getElementById('pvType');

    if (text.length < 5) {
        previewBox.classList.remove('show');
        return;
    }

    const result = analyzeNews(text);
    previewBox.classList.add('show');

    if (result.companies.length === 0) {
        pvCompanies.textContent = '⚠️ لم يتم التعرف على شركة (استخدم التحكم اليدوي)';
    } else {
        pvCompanies.textContent = result.companies.map(c => c.name + ' (' + c.id + ')').join(' · ');
    }

    if (result.effect === 0) {
        pvEffect.innerHTML = '➖ محايد (لا يوجد تأثير واضح)';
    } else {
        const sign = result.effect > 0 ? '+' : '';
        const cls = result.effect > 0 ? 'plus' : 'minus';
        pvEffect.innerHTML = `<span class="${cls}">${sign}${(result.effect * 100).toFixed(0)}%</span>`;
    }

    if (result.sentiment !== 'neutral') {
        pvTypeRow.style.display = 'block';
        pvType.textContent = result.sentiment === 'positive' ? '✅ إيجابي' : '⚠️ سلبي';
    } else {
        pvTypeRow.style.display = 'none';
    }
});

// ✅ ملء قائمة الشركات في التحكم اليدوي
function fillManualCompanies() {
    const sel = document.getElementById('manualCompany');
    sel.innerHTML = '<option value="">— اختر شركة (اختياري) —</option>';
    COMPANIES.forEach(c => {
        sel.innerHTML += `<option value="${c.id}">${c.name} (${c.id})</option>`;
    });
}

function showMsg(text, ok) {
    const msg = document.getElementById('msg');
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.textContent = text;
    setTimeout(() => { msg.textContent = ''; msg.className = ''; }, 4000);
}

// ✅ إضافة خبر
window.addNews = async function() {
    const text = document.getElementById('newsText').value.trim();
    const manualCompany = document.getElementById('manualCompany').value;
    const manualEffect = document.getElementById('manualEffect').value;

    if (!text) return showMsg('❌ اكتب نص الخبر', false);

    // تحليل تلقائي
    const result = analyzeNews(text);

    // تحديد الشركات النهائية: يدوي أولاً، ثم تلقائي
    let finalIds = result.companyIds;
    if (manualCompany) {
        finalIds = [manualCompany];
    }

    if (finalIds.length === 0) {
        return showMsg('❌ لم يتم التعرف على أي شركة. اختر شركة يدوياً.', false);
    }

    // تحديد التأثير النهائي: يدوي أولاً، ثم تلقائي
    let finalEffect = result.effect;
    if (manualEffect) {
        finalEffect = parseFloat(manualEffect);
    }

    if (finalEffect === 0) {
        return showMsg('❌ التأثير صفر. أضف كلمة إيجابية/سلبية للخبر أو حدد التأثير يدوياً.', false);
    }

    try {
        await addDoc(newsRef, {
            text: text,
            ids: finalIds,
            effect: finalEffect,
            createdAt: Date.now()
        });
        // مسح الكاش عشان اللعبة تحمل الأخبار الجديدة
        localStorage.removeItem('money_game_news');
        showMsg('✅ تم إضافة الخبر بنجاح ونشره في اللعبة', true);
        document.getElementById('newsText').value = '';
        document.getElementById('manualCompany').value = '';
        document.getElementById('manualEffect').value = '';
        document.getElementById('previewBox').classList.remove('show');
        loadNews();
    } catch(e) {
        showMsg('❌ خطأ: ' + e.message, false);
    }
};

// ✅ حذف خبر
window.deleteNews = async function(id) {
    if (!confirm('هل تريد حذف هذا الخبر؟')) return;
    try {
        await deleteDoc(doc(db, "game_news", id));
        localStorage.removeItem('money_game_news');
        showMsg('✅ تم حذف الخبر', true);
        loadNews();
    } catch(e) {
        showMsg('❌ خطأ: ' + e.message, false);
    }
};

// ✅ تحميل قائمة الأخبار
async function loadNews() {
    const list = document.getElementById('newsList');
    const countEl = document.getElementById('newsCount');
    list.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
    try {
        const snap = await getDocs(newsRef);
        if (snap.empty) {
            list.innerHTML = '<div class="empty">لا توجد أخبار بعد. أضف خبراً جديداً.</div>';
            countEl.textContent = '0';
            return;
        }
        const news = [];
        snap.forEach(d => news.push({ id: d.id, ...d.data() }));
        news.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        countEl.textContent = news.length;

        list.innerHTML = news.map(n => {
            const effectColor = n.effect >= 0 ? '#00ff88' : '#ff3b3b';
            const effectSign = n.effect >= 0 ? '+' : '';
            const companyNames = n.ids.map(id => {
                const c = COMPANIES.find(x => x.id === id);
                return c ? c.name : id;
            }).join(' · ');
            return `<div class="news-row">
                <div class="info">
                    <div class="text">${n.text}</div>
                    <div class="meta">
                        🏢 <b>${companyNames}</b> ·
                        📊 التأثير: <b style="color:${effectColor}">${effectSign}${(n.effect * 100).toFixed(1)}%</b>
                    </div>
                </div>
                <button class="btn-danger" onclick="deleteNews('${n.id}')">🗑️ حذف</button>
            </div>`;
        }).join('');
    } catch(e) {
        list.innerHTML = '<div class="empty" style="color:#ff3b3b;">خطأ: ' + e.message + '</div>';
    }
}

// ✅ التشغيل
fillManualCompanies();
loadNews();
</script>
</body>
</html>
